<meta charset="utf-8">
<title>Kasvihuoneen kasvikartta · Alapihan Puutarha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;600;700;800&display=swap">
<style>
  /* look of alapihanpuutarha.fi: white page, Roboto Slab, navy headings, pink pill buttons */
  :root { --pink: #f48fb1; --pink-strong: #e2769c; --pink-soft: #fde8ef; --pink-ink: #ffffff; --heading: #2e4371; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pink-soft: #4a3040; --heading: #c9d6f2; } }
  :root[data-theme="dark"] { --pink-soft: #4a3040; --heading: #c9d6f2; }
  .btn-site, button.primary { text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: .8rem; border-radius: 999px; }
  :root {
    --bg: #f5f5f6;
    --surface: #ffffff;
    --ink: #141c2d;
    --muted: #66705f;
    --line: #d9d5c8;
    --wall: #3b4a3f;
    --table: #e7dcc6;
    --table-stroke: #a8916a;
    --table-empty: #f1ece1;
    --table-filled: #dcc595;
    --plant: #5f9b62;
    --plant-stroke: #3d7341;
    --plant-empty: #c5d6c0;
    --accent: #e0882f;
    --accent-soft: #f7d9b5;
    --select: #c4581b;
    --badge-bg: #1f2a22;
    --badge-ink: #ffffff;
    --focus: #2d6fd6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a16;
      --surface: #1d241f;
      --ink: #e8ece4;
      --muted: #9aa695;
      --line: #344037;
      --wall: #b8c7b9;
      --table: #4a4234;
      --table-stroke: #8d7a58;
      --table-empty: #2c2a24;
      --table-filled: #6e5c3a;
      --plant: #6fb06f;
      --plant-stroke: #9bd29a;
      --plant-empty: #3b5340;
      --accent: #f0a050;
      --accent-soft: #5a3f22;
      --select: #ffb46b;
      --badge-bg: #e8ece4;
      --badge-ink: #141a16;
      --focus: #7aa8ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141a16; --surface: #1d241f; --ink: #e8ece4; --muted: #9aa695; --line: #344037;
    --wall: #b8c7b9; --table: #4a4234; --table-stroke: #8d7a58; --table-empty: #2c2a24; --table-filled: #6e5c3a;
    --plant: #6fb06f; --plant-stroke: #9bd29a; --plant-empty: #3b5340;
    --accent: #f0a050; --accent-soft: #5a3f22; --select: #ffb46b;
    --badge-bg: #e8ece4; --badge-ink: #141a16; --focus: #7aa8ff;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 300 15px/1.55 "Roboto Slab", Georgia, serif;
  }
  header, main {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { padding-block: 20px 8px; max-width: 1180px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .head-text { min-width: 0; }
  .theme-toggle {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 999px; font-size: .85rem;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  }
  .theme-toggle:hover { border-color: var(--pink-strong); }
  .theme-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .theme-toggle .i-sun { display: none; }
  .theme-toggle.is-dark .i-sun { display: block; }
  .theme-toggle.is-dark .i-moon { display: none; }
  @media (max-width: 480px) { .theme-label { display: none; } .theme-toggle { padding: 9px; } }
  .back { display: inline-block; margin-bottom: 6px; color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 600; }
  .back:hover { color: var(--ink); text-decoration: underline; }
  h1 { font-size: 1.5rem; font-weight: 400; color: var(--heading); margin: 0; text-wrap: balance; }
  b, strong { font-weight: 600; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .status { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: .82rem; color: var(--muted); }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--plant); }
  .status[data-state="loading"]::before { background: var(--accent); }
  .status[data-state="readonly"]::before, .status[data-state="offline"]::before { background: var(--muted); }

  main {
    max-width: 1180px; margin: 0 auto; padding-block: 8px 32px;
    display: grid; gap: 20px;
    grid-template-columns: minmax(0, 1fr);
  }
  @media (min-width: 900px) {
    main { grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr); align-items: start; }
    .panel { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  }

  .map-wrap {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; position: relative;
  }
  .map-title {
    margin: 2px 0 10px; text-align: center; font-size: clamp(1.6rem, 4.8vw, 2.4rem); font-weight: 300;
    color: var(--heading); line-height: 1.15;
  }
  svg.map { display: block; width: 100%; height: auto; max-height: calc(100vh - 150px); margin: 0 auto; touch-action: manipulation; }

  /* walls */
  .wall { fill: none; stroke: var(--wall); stroke-width: 6; stroke-linecap: round; }
  .floor { fill: var(--bg); opacity: .55; }
  .entrance-text { fill: var(--muted); font-size: 22px; font-weight: 600; text-anchor: middle; }
  .entrance-arrow { stroke: var(--muted); stroke-width: 3; fill: none; }
  /* sections */
  .sec { cursor: pointer; outline: none; }
  .sec .shape { transition: fill .15s, stroke .15s; }
  .sec.table .shape { fill: var(--table); stroke: var(--table-stroke); stroke-width: 2; }
  .sec.table.empty .shape { fill: var(--table-empty); stroke-dasharray: 4 4; }
  .sec.plants .pot { fill: var(--plant); stroke: var(--plant-stroke); stroke-width: 2; transition: fill .15s, stroke .15s; }
  .sec.plants.empty .pot { fill: var(--plant-empty); }
  .sec.plants .hit { fill: transparent; stroke: transparent; stroke-width: 2; rx: 14; pointer-events: none; }
  .sec.plants .tap { fill: transparent; }
  /* pöytä sections and side strips */
  .sec.table .shape { stroke-width: 1; }
  .sec.table:not(.empty) .shape { fill: var(--table-filled); }
  .sec.table.side .shape { stroke-width: 1.2; }
  .side-hit { fill: transparent; }
  .sec.table.side.empty .shape { fill: var(--table); stroke-dasharray: none; }
  .sec.table.side:not(.empty) .shape { fill: var(--table-stroke); }
  .frame { pointer-events: none; }
  .frame-outline { fill: none; stroke: var(--table-stroke); stroke-width: 2; }
  svg.map[data-tab="lane"]:not(.searching) .frame,
  svg.map[data-tab="plants"]:not(.searching) .frame { opacity: .3; }
  .sec.lane .lane-hit { fill: transparent; }
  .sec.lane .shape { fill: var(--plant); stroke: var(--plant-stroke); stroke-width: 1.5; }
  .sec.lane.empty .shape { fill: var(--bg); stroke: var(--table-stroke); stroke-dasharray: 4 3; }
  svg.map .sec.lane:hover .shape, svg.map .sec.lane.hl .shape { fill: var(--accent); stroke: var(--select); stroke-dasharray: none; }
  svg.map .sec.lane.selected .shape { fill: var(--accent); stroke: var(--select); stroke-width: 3; }
  .lane-num { fill: var(--muted); font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

  svg.map .sec:hover .shape, svg.map .sec.hl .shape { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: none; }
  svg.map .sec.plants:hover .pot, svg.map .sec.plants.hl .pot { fill: var(--accent); stroke: var(--select); }
  svg.map .sec.plants:hover .hit, svg.map .sec.plants.hl .hit { stroke: var(--accent); stroke-dasharray: 4 4; }

  svg.map .sec.selected .shape { fill: var(--accent-soft); stroke: var(--select); stroke-width: 4; stroke-dasharray: none; }
  svg.map .sec.plants.selected .pot { fill: var(--accent); stroke: var(--select); }
  svg.map .sec.plants.selected .hit { stroke: var(--select); stroke-width: 3; stroke-dasharray: none; }
  svg.map .sec:focus-visible .shape, svg.map .sec.plants:focus-visible .hit { stroke: var(--focus); stroke-width: 4; stroke-dasharray: none; }

  /* switching between houses: arrows, dots, swipe */
  .house-nav {
    max-width: 1180px; margin: 0 auto; padding-block: 6px 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px;
  }
  .house-nav a { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); border-radius: 14px; min-height: 52px; min-width: 0; }
  .hn-prev { justify-self: start; padding: 6px 14px 6px 8px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
  .hn-prev:hover { border-color: var(--pink-strong); background: var(--pink-soft); }
  .hn-next { justify-self: end; padding: 6px 8px 6px 16px; background: var(--pink); color: var(--pink-ink) !important; border: 1.5px solid var(--pink-strong); font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.14); }
  .hn-next:hover { background: var(--pink-strong); }
  .hn-label { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; text-align: right; }
  .hn-label small { font-size: .72rem; font-weight: 600; opacity: .75; text-transform: uppercase; letter-spacing: .06em; }
  .hn-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hn-arrow { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; font-size: 1.5rem; font-weight: 800; line-height: 1; }
  .hn-prev .hn-arrow { background: var(--bg); }
  .hn-next .hn-arrow { background: #fff; color: var(--pink-strong); font-size: 1.8rem; }
  .hn-dots { display: flex; gap: 7px; align-items: center; }
  .hn-dots a { width: 12px; height: 12px; min-height: 0; border-radius: 50%; background: var(--line); padding: 0; }
  .hn-dots a[aria-current="page"] { background: var(--pink-strong); width: 26px; border-radius: 999px; }
  @media (max-width: 560px) {
    .house-nav { grid-template-columns: auto minmax(0, 1fr); row-gap: 8px; }
    .hn-dots { grid-column: 1 / -1; grid-row: 2; justify-content: center; }
    .hn-prev .hn-name { display: none; }
    .hn-prev { padding: 6px; }
  }
  /* on phones and tablets a round arrow stays at the right edge while scrolling */
  .edge-arrow {
    position: fixed; right: max(8px, env(safe-area-inset-right, 0px)); top: 50%; z-index: 20; transform: translateY(-50%);
    width: 50px; height: 50px; border-radius: 50%; display: none; place-items: center;
    background: var(--pink); color: var(--pink-ink); border: 1.5px solid var(--pink-strong); font-size: 1.8rem; font-weight: 800; text-decoration: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.28); opacity: .92;
  }
  @media (max-width: 899px) { .edge-arrow { display: grid; } }
  @keyframes slide-from-right { from { transform: translateX(48px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slide-from-left { from { transform: translateX(-48px); opacity: 0; } to { transform: none; opacity: 1; } }
  main.slide-next { animation: slide-from-right .22s ease-out; }
  main.slide-prev { animation: slide-from-left .22s ease-out; }
  main.leaving-next { transform: translateX(-36px); opacity: 0; transition: transform .14s ease-in, opacity .14s ease-in; }
  main.leaving-prev { transform: translateX(36px); opacity: 0; transition: transform .14s ease-in, opacity .14s ease-in; }
  @media (prefers-reduced-motion: reduce) { main.slide-next, main.slide-prev { animation: none; } main.leaving-next, main.leaving-prev { transition: none; } }

  /* view buttons above the map: choose which kind to show */
  .view-bar { max-width: 1180px; margin: 0 auto; padding-block: 4px 6px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .view-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .view-buttons button {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .95rem;
    background: var(--surface); color: var(--ink); border: 1.5px solid var(--line);
  }
  .view-buttons button:hover { border-color: var(--pink-strong); }
  .view-buttons button[aria-pressed="true"] { background: var(--pink); color: var(--pink-ink); border-color: var(--pink-strong); }
  .view-buttons .count { font-size: .78rem; font-weight: 500; opacity: .7; font-variant-numeric: tabular-nums; }
  .kdot { display: inline-block; flex: none; }
  .kind-all .kdot { width: 14px; height: 14px; border-radius: 4px; background: conic-gradient(var(--table) 0 33%, var(--plant) 0 66%, var(--plant-empty) 0); border: 1.5px solid var(--table-stroke); }
  .kind-table .kdot { width: 16px; height: 11px; border-radius: 3px; background: var(--table); border: 1.5px solid var(--table-stroke); }
  .kind-lane .kdot { width: 5px; height: 16px; border-radius: 3px; background: var(--plant); border: 1.5px solid var(--plant-stroke); }
  .kind-plants .kdot { width: 13px; height: 13px; border-radius: 50%; background: var(--plant); border: 1.5px solid var(--plant-stroke); }
  @media (max-width: 480px) {
    .view-buttons { display: grid; grid-template-columns: 1fr 1fr; }
    .view-buttons button { justify-content: center; padding: 10px 8px; font-size: .9rem; }
  }

  /* only the chosen kind is shown; tables stay faint as a guide */
  .sec { transition: opacity .15s; }
  svg.map[data-tab="table"]:not(.searching) .sec.lane,
  svg.map[data-tab="table"]:not(.searching) .sec.plants,
  svg.map[data-tab="lane"]:not(.searching) .sec.plants,
  svg.map[data-tab="plants"]:not(.searching) .sec.lane { display: none; }
  svg.map[data-tab="lane"]:not(.searching) .sec.table,
  svg.map[data-tab="plants"]:not(.searching) .sec.table { opacity: .3; pointer-events: none; }
  svg.map[data-tab="table"]:not(.searching) .lane-num,
  svg.map[data-tab="plants"]:not(.searching) .lane-num { display: none; }
  svg.map[data-tab="lane"] .sec.lane.empty .shape { stroke: var(--plant-stroke); stroke-width: 2; }

  .map.searching .sec:not(.match) { opacity: .25; pointer-events: none; }
  .map.searching .sec.match .shape { stroke: var(--select); stroke-width: 4; }
  .map.searching .sec.plants.match .hit { stroke: var(--select); stroke-width: 3; stroke-dasharray: none; }

  .badge circle { fill: var(--badge-bg); }
  .badge text { fill: var(--badge-ink); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .sec-label { fill: var(--ink); font-size: 17px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .sec-label.empty { fill: var(--muted); font-weight: 400; font-style: italic; font-size: 15px; }

  /* tooltip (mouse only) */
  .tip {
    position: absolute; pointer-events: none; z-index: 5;
    background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 8px;
    font-size: 13px; max-width: 220px; opacity: 0; transition: opacity .1s; transform: translate(-50%, calc(-100% - 12px));
  }
  .tip.show { opacity: 1; }
  .tip b { display: block; }

  /* panel */
  .panel { display: grid; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .card h2 { font-size: .8rem; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--heading); margin: 0 0 8px; }
  input[type=search], input[type=text], textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }

  .detail-title { display: flex; align-items: center; gap: 10px; }
  .detail-title .code, .pop-head .code { white-space: nowrap; flex: none; }
  .detail-title .code { background: var(--badge-bg); color: var(--badge-ink); font-weight: 700; border-radius: 999px; padding: 2px 10px; font-size: .85rem; }
  .detail-title h3 { margin: 0; font-size: 1.1rem; }
  .species { font-size: 1.35rem; font-weight: 650; margin: 10px 0 2px; }
  .species.none { color: var(--muted); font-weight: 400; font-style: italic; font-size: 1rem; }
  .note { color: var(--muted); margin: 4px 0 0; white-space: pre-wrap; }
  .hint { color: var(--muted); margin: 0; }

  /* pop-up editor */
  [hidden] { display: none !important; }
  .pop-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(20, 26, 22, .45);
    display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .pop {
    width: min(440px, 100%); max-height: 100%; overflow: auto;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px;
    box-shadow: 0 18px 50px rgba(0,0,0,.25);
    animation: pop-in .14s ease-out;
  }
  @keyframes pop-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
  @media (max-width: 560px) {
    .pop-backdrop { align-items: flex-end; padding-bottom: 0; }
    .pop { border-radius: 16px 16px 0 0; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
  }
  .pop-head { display: flex; align-items: flex-start; gap: 10px; }
  .pop-head .code { background: var(--badge-bg); color: var(--badge-ink); font-weight: 700; border-radius: 999px; padding: 3px 10px; font-size: .85rem; margin-top: 2px; }
  .pop-titles { flex: 1; min-width: 0; }
  .pop-kind { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .pop-titles h3 { margin: 0; font-size: 1.05rem; text-wrap: balance; }
  .pop-x { flex: none; width: 36px; height: 36px; padding: 0; border-radius: 50%; font-size: 1.4rem; line-height: 1; background: none; }
  .pop input[type=text] { font-size: 1.1rem; padding: 12px 14px; }
  .pop .btns button { flex: 1 1 auto; }
  .pop .danger { color: var(--select); }
  .pop input[type=password] { font: inherit; font-size: 1.1rem; padding: 12px 14px; width: 100%; box-sizing: border-box; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  .pop-hint { margin: 4px 0 0; font-size: .8rem; color: var(--muted); }
  .pop-err { margin: 8px 0 0; font-size: .9rem; font-weight: 600; color: var(--select); }
  .pop button:disabled { opacity: .6; cursor: progress; }
  .pop-readonly { display: none; }
  .pop.readonly .pop-readonly, .pop-backdrop.readonly .pop-readonly { display: block; }
  .pop-backdrop.readonly .pop-edit { display: none; }

  .btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    font: inherit; border-radius: 10px; padding: 9px 14px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  button.primary { background: var(--pink); color: var(--pink-ink); border-color: var(--pink-strong); font-weight: 700; }
  button.primary:hover { background: var(--pink-strong); }
  button:hover { border-color: var(--pink-strong); }

  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li + li { border-top: 1px solid var(--line); }
  ul.list button {
    width: 100%; text-align: left; border: 0; background: none; border-radius: 8px;
    display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 9px 6px; align-items: center;
  }
  ul.list button:hover, ul.list button.hl { background: var(--accent-soft); }
  ul.list button.selected { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--select); }
  ul.list .c { font-weight: 700; font-size: .85rem; color: var(--muted); }
  ul.list .n { display: block; font-size: .82rem; color: var(--muted); }
  ul.list .s { display: block; font-weight: 600; }
  ul.list .s.none { font-weight: 400; font-style: italic; color: var(--muted); }
  ul.list li.hidden { display: none; }
  .group-title { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 4px; }
  .group-title:first-of-type { margin-top: 0; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-top: 10px; justify-content: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 18px; height: 12px; border-radius: 3px; border: 2px solid var(--table-stroke); background: var(--table); display: inline-block; }

</style>

<script src="pin-gate.js"></script>
<script>
/* ------------------------------------------------------------------
   Sections of the greenhouse. Edit the "species" and "note" values
   here to set the default labels everyone sees. Labels edited in the
   page are saved in this browser on top of these defaults.
------------------------------------------------------------------- */
/* Which greenhouse this is: kasvihuone.html?talo=1…5 (opened from the yard page).
   Kasvihuone 1 (talo=2) keeps the original codes (T4-S1…); the others get a prefix
   (K1-T4-S1…), so all four share one spreadsheet without mixing up. */
const HOUSES = { "1": "K1-", "2": "", "3": "K3-", "4": "K4-", "5": "K5-" };
const HOUSE_NAMES = { "1": "Tilaushuone A", "2": "Kasvihuone 1", "3": "Kasvihuone 2", "4": "Kasvihuone 3", "5": "Tilaushuone B" };
const HOUSE_NO = (() => { try { const n = new URLSearchParams(location.search).get("talo"); return n in HOUSES ? n : "2"; } catch (e) { return "2"; } })();
const HOUSE_PREFIX = HOUSES[HOUSE_NO];
const HOUSE_NAME = HOUSE_NAMES[HOUSE_NO];
const IS_ORIGINAL = HOUSE_NO === "2";   // Kasvihuone 1 (talo=2): the hand-traced layout below, unchanged

/* The other houses: a floor plan with the same proportions as the house seen
   from above on the yard page (outer width × length there), scaled the same
   way as Kasvihuone 1 (156 × 385 there → 784 × 1110 here). Tables run front
   to back with walkways between them; a wide house also gets floor strips
   (Lattia) and outermost kukkakourut along its walls. */
const OUTER = { "1": [70, 336], "3": [120, 449], "4": [76, 260], "5": [42, 132] };
function genLayout(no) {
  const [ow, oh] = OUTER[no];
  const W = Math.round(ow * 784 / 156), H = Math.round(oh * 1110 / 385);
  const floors = W >= 500, n = W >= 500 ? 3 : 2;
  const TOP = 90, LEN = H - TOP - 110;
  const SIDE = 16, WALK = 70, MARGIN = 8, FLOOR_X = 6, FLOOR_W = 38;   // SIDE = side strip + gap
  const x0 = floors ? FLOOR_X + FLOOR_W + MARGIN : MARGIN;
  const x1 = floors ? W - FLOOR_X - FLOOR_W - MARGIN : W - MARGIN;
  const tw = (x1 - x0 - (n - 1) * WALK) / n - 2 * SIDE;
  const places = n === 2 ? ["vasen seinä", "oikea seinä"] : ["vasen seinä", "keskellä", "oikea seinä"];
  const tables = places.map((place, i) => ({
    id: "T" + (i + 1), place, dir: "v", lines: tw >= 60 ? 4 : 2,
    rect: [Math.round(x0 + i * (tw + 2 * SIDE + WALK) + SIDE), TOP, Math.round(tw), LEN],
  }));
  if (floors) tables.push(
    { id: "LV", title: "Lattia, vasen", place: "vasen reuna", dir: "v", floor: true, rect: [FLOOR_X, TOP, FLOOR_W, LEN] },
    { id: "LO", title: "Lattia, oikea", place: "oikea reuna", dir: "v", floor: true, rect: [W - FLOOR_X - FLOOR_W, TOP, FLOOR_W, LEN] });
  return { W, H, TOP, LEN, floors, tables };
}
const LAYOUT = IS_ORIGINAL
  ? { W: 784, H: 1110, TOP: 112, LEN: 800, floors: true }
  : genLayout(HOUSE_NO);

/* Long tables each carry 4 narrow planting lines drawn on top,
   numbered 1–4 from the left. The table and each line are labelled separately. */
const LINE_COUNT = 4;
/* Every pöytä is split into 6 equal sections along its length, with a thin
   strip along each long side split into 3 parts. dir "v" = runs front to back,
   "h" = runs left to right (the two short tables on the back wall). */
const SECTION_COUNT = 6, SIDE_PARTS = 3;
const ORIGINAL_TABLES = [
  { id: "T1", place: "takana vasemmalla",               dir: "h", rect: [60, 18, 192, 50] },
  { id: "T2", place: "takana oikealla",              dir: "h", rect: [532, 18, 192, 50] },
  { id: "T3", place: "vasen seinä",               dir: "v", rect: [100, 112, 83, 800] },
  { id: "T4", place: "keskellä, käytävän vasemmalla puolella",  dir: "v", rect: [255, 112, 96, 800] },
  { id: "T6", place: "keskellä, käytävän oikealla puolella", dir: "v", rect: [433, 112, 96, 800] },
  { id: "T7", place: "oikea seinä",              dir: "v", rect: [601, 112, 83, 800] },
  // Lattia: thin planting areas on the ground along the outer walls,
  // under the outermost kukkakourut (no side strips, no table kukkakourut)
  { id: "LV", title: "Lattia, vasen", place: "vasen reuna", dir: "v", floor: true, rect: [6, 112, 38, 800] },
  { id: "LO", title: "Lattia, oikea", place: "oikea reuna", dir: "v", floor: true, rect: [740, 112, 38, 800] },
];
const TABLES = IS_ORIGINAL ? ORIGINAL_TABLES : LAYOUT.tables;
const LINED_TABLES = TABLES.filter(t => t.dir === "v" && !t.floor);
// side strips only on the long tables (not on T1/T2 by the back wall)
const SIDES = { v: [["L", "vasen sivu"], ["R", "oikea sivu"]], h: [] };
function sectionWhere(t, n) {
  if (n === 1) return t.dir === "v" ? " (takapää)" : " (vasen pää)";
  if (n === SECTION_COUNT) return t.dir === "v" ? " (oven puoleinen pää)" : " (oikea pää)";
  return "";
}
function partWhere(t, n) {
  if (n === 1) return t.dir === "v" ? " (takana)" : " (vasemmalla)";
  if (n === SIDE_PARTS) return t.dir === "v" ? " (oven puolella)" : " (oikealla)";
  return " (keskellä)";
}

// Kasvihuone 1 (talo=2) own extra sections
const ORIGINAL_EXTRAS = [
  { id: "T1-1", kind: "lane", group: "Kukkakourut pöydällä T1", name: "Kukkakouru, pöytä T1", species: "", note: "" },
  { id: "T2-1", kind: "lane", group: "Kukkakourut pöydällä T2", name: "Kukkakouru, pöytä T2", species: "", note: "" },
  { id: "KE", kind: "lane", group: "Kukkakourut reunimmaiset", name: "Kukkakouru, sisäänkäynnin vasemmalla puolella", species: "", note: "" },
  { id: "KR-L", kind: "lane", group: "Kukkakourut reunimmaiset", name: "Kukkakouru reunimmainen, vasen", species: "", note: "" },
  { id: "KR-R", kind: "lane", group: "Kukkakourut reunimmaiset", name: "Kukkakouru reunimmainen, oikea", species: "", note: "" },
  { id: "H1", kind: "plants", group: "Amppelit", name: "Amppelit, takana vasemmalla",   species: "", note: "" },
  { id: "H2", kind: "plants", group: "Amppelit", name: "Amppelit, takana oikealla",  species: "", note: "" },
  { id: "H3", kind: "plants", group: "Amppelit", name: "Amppelit, vasen seinä",   species: "", note: "" },
  { id: "H4", kind: "plants", group: "Amppelit", name: "Amppelit, oikea seinä",  species: "", note: "" },
  { id: "H5", kind: "plants", group: "Amppelit", name: "Amppelit, sisäänkäynnin luona", species: "", note: "" },
  { id: "H6", kind: "plants", group: "Amppelit", name: "Amppelit, pöydän T4 yllä",  species: "", note: "" },
  { id: "H7", kind: "plants", group: "Amppelit", name: "Amppelit, pöydän T6 yllä",  species: "", note: "" },
];

const DEFAULT_SECTIONS = [
  ...TABLES.flatMap(t => [
    ...Array.from({ length: SECTION_COUNT }, (_, i) => ({
      id: `${t.id}-S${i + 1}`, kind: "table", part: "main", group: "Pöydät",
      name: `${t.title || "Pöytä " + t.id} · osa ${i + 1}/${SECTION_COUNT}${sectionWhere(t, i + 1)}`, species: "", note: "",
      floor: !!t.floor,
    })),
    ...(t.floor ? [] : SIDES[t.dir]).flatMap(([code, sideName]) => Array.from({ length: SIDE_PARTS }, (_, i) => ({
      id: `${t.id}-${code}${i + 1}`, kind: "table", part: "side", group: "Pöydät",
      name: `Pöytä ${t.id} · ${sideName}, osa ${i + 1}/${SIDE_PARTS}${partWhere(t, i + 1)}`, species: "", note: "",
    }))),
  ]),
  ...LINED_TABLES.flatMap(t => Array.from({ length: t.lines || LINE_COUNT }, (_, i) => ({
    id: `${t.id}-${i + 1}`, kind: "lane", group: `Kukkakourut pöydällä ${t.id} (${t.place})`,
    name: `Kukkakouru ${i + 1}, pöytä ${t.id}`, species: "", note: "",
  }))),
  ...(IS_ORIGINAL ? ORIGINAL_EXTRAS : genExtras()),
];
function genExtras() {
  return [
    ...(LAYOUT.floors ? [
      { id: "KR-L", kind: "lane", group: "Kukkakourut reunimmaiset", name: "Kukkakouru reunimmainen, vasen", species: "", note: "" },
      { id: "KR-R", kind: "lane", group: "Kukkakourut reunimmaiset", name: "Kukkakouru reunimmainen, oikea", species: "", note: "" },
    ] : []),
    ...LINED_TABLES.map((t, i) => ({ id: "H" + (i + 1), kind: "plants", group: "Amppelit", name: `Amppelit, pöydän ${t.id} yllä`, species: "", note: "" })),
  ];
}

/* The three tabs above the map: each shows one kind of section. */
const TABS = [
  { kind: "all",    label: "Kaikki",      hint: "Napauta pöytää, kukkakourua tai amppeliriviä nähdäksesi, mitä siinä kasvaa." },
  { kind: "table",  label: "Pöydät",      hint: "Napauta jotakin pöydän kuudesta osasta tai pöydän sivulla olevaa kaistaa nähdäksesi, mitä siinä kasvaa." },
  { kind: "lane",   label: "Kukkakourut", hint: "Napauta kukkakourua (kapeat viivat pitkillä pöydillä) nähdäksesi, mitä siinä kasvaa." },
  { kind: "plants", label: "Amppelit",    hint: "Napauta amppeliriviä nähdäksesi, mitä siinä kasvaa." },
];

/* Geometry, traced from the hand sketch (units are SVG viewBox units). */
const range = (n, a, b) => Array.from({ length: n }, (_, i) => a + (b - a) * i / (n - 1));
const W = LAYOUT.W, H = LAYOUT.H;  // inner width/height of the greenhouse (784 × 1110 in Kasvihuone 1)
const DOOR = [W / 2 - 50, W / 2 + 50];   // entrance gap in the front wall ([342, 442] in Kasvihuone 1)
// extra floor added outside the original sketch on the left and right,
// where the outermost kukkakourut (reunimmaiset) run along the walls
const EDGE_LANE_X = 25, EDGE_LANE_W = 12;
const FRAME_BADGE_Y = LAYOUT.TOP - 17;
const SIDE_W = 14, SIDE_GAP = 2, PART_GAP = 4;
const GEOM = IS_ORIGINAL ? {
  H1: { pts: range(5, 78, 230).map(x => [x, 52]),  r: 11, badge: [272, 52] },
  H2: { pts: range(5, 554, 706).map(x => [x, 52]), r: 11, badge: [512, 52] },
  H3: { pts: range(17, 130, 898).map(y => [114, y]), r: 13, badge: [114, 952] },
  H4: { pts: range(17, 130, 898).map(y => [668, y]), r: 13, badge: [668, 952] },
  H5: { pts: range(14, 70, 714).map(x => [x, 1010]), r: 14, badge: [392, 1056], label: [392, 1056] },
  H6: { pts: range(17, 130, 898).map(y => [279, y]), r: 13, badge: [279, 952] },
  H7: { pts: range(17, 130, 898).map(y => [505, y]), r: 13, badge: [505, 952] },
} : {};
// other houses: one amppeli row above the middle of each long table
if (!IS_ORIGINAL) LINED_TABLES.forEach((t, i) => {
  const [x, y, w, h] = t.rect, cx = x + w / 2;
  const count = Math.max(3, Math.round((h - 32) / 48) + 1);
  GEOM["H" + (i + 1)] = { pts: range(count, y + 18, y + h - 14).map(py => [cx, py]), r: 13, badge: [cx, y + h + 40] };
});
for (const t of TABLES) {
  const [x, y, w, h] = t.rect;
  const len = t.dir === "v" ? h : w;
  const seg = len / SECTION_COUNT;
  for (let i = 0; i < SECTION_COUNT; i++) {
    GEOM[`${t.id}-S${i + 1}`] = { rx: 0, rect: t.dir === "v" ? [x, y + i * seg, w, seg] : [x + i * seg, y, seg, h] };
  }
  if (t.floor || !SIDES[t.dir].length) continue;
  const part = (len - PART_GAP * (SIDE_PARTS - 1)) / SIDE_PARTS;
  const [[a], [b]] = SIDES[t.dir];
  for (let i = 0; i < SIDE_PARTS; i++) {
    const off = i * (part + PART_GAP);
    if (t.dir === "v") {
      GEOM[`${t.id}-${a}${i + 1}`] = { rx: 3, rect: [x - SIDE_GAP - SIDE_W, y + off, SIDE_W, part] };
      GEOM[`${t.id}-${b}${i + 1}`] = { rx: 3, rect: [x + w + SIDE_GAP, y + off, SIDE_W, part] };
    } else {
      GEOM[`${t.id}-${a}${i + 1}`] = { rx: 3, rect: [x + off, y - SIDE_GAP - SIDE_W, part, SIDE_W] };
      GEOM[`${t.id}-${b}${i + 1}`] = { rx: 3, rect: [x + off, y + h + SIDE_GAP, part, SIDE_W] };
    }
  }
}

const LINE_W = 9, LINE_HIT_W = 17, LINE_INSET = 10;
for (const t of LINED_TABLES) {
  const lines = t.lines || LINE_COUNT, [x, y, w, h] = t.rect, lw = w / lines;
  for (let i = 0; i < lines; i++) {
    const cx = x + i * lw + lw / 2;
    GEOM[`${t.id}-${i + 1}`] = {
      rect: [cx - LINE_W / 2, y + LINE_INSET, LINE_W, h - LINE_INSET * 2],
      hit: [cx - LINE_HIT_W / 2, y + LINE_INSET - 4, LINE_HIT_W, h - LINE_INSET * 2 + 8],
      num: [cx, y + h + 14],
    };
  }
}
// one kukkakouru along the back edge of each back-wall table (T1, T2), behind the amppelit
for (const t of TABLES.filter(t => t.dir === "h")) {
  const [x, y, w, h] = t.rect, cy = y + 10;
  GEOM[`${t.id}-1`] = { rect: [x + 10, cy - LINE_W / 2, w - 20, LINE_W], hit: [x + 6, cy - LINE_HIT_W / 2, w - 12, LINE_HIT_W] };
}
// kukkakouru along the front wall, left of the entrance (Kasvihuone 1 only)
if (IS_ORIGINAL) GEOM.KE = { rect: [12, 1078, DOOR[0] - 10 - 12, EDGE_LANE_W], hit: [8, 1072, DOOR[0] - 6 - 8, EDGE_LANE_W + 12] };
// outermost kukkakourut along the left and right walls, same length as the long tables
if (LAYOUT.floors) for (const [id, cx] of [["KR-L", EDGE_LANE_X], ["KR-R", W - EDGE_LANE_X]]) {
  GEOM[id] = {
    rect: [cx - EDGE_LANE_W / 2, LAYOUT.TOP, EDGE_LANE_W, LAYOUT.LEN],
    hit: [cx - EDGE_LANE_W / 2 - 6, LAYOUT.TOP - 4, EDGE_LANE_W + 12, LAYOUT.LEN + 8],
  };
}

/* ---------------- state + storage ----------------
   Published on claude.ai: labels live in the artifact's shared database
   (collection "sections", one document per section id), so everyone
   with the link sees the same labels, live.
   On GitHub Pages: labels live in a shared Google Sheet, reached through
   the Apps Script web app at SHEETS_URL (see apps-script/Code.gs).
   Opened as a local file with no SHEETS_URL: saved in this browser only. */
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbwWY8sem3miGc5jaAXFI-Tpx4VAcDmnkjXZE0Y2FD2aC4Kgof2e7thvC7HCZFCyuNht/exec"; // Apps Script web app (ends in /exec)
const SHEETS_POLL_MS = 15000;
const STORE_KEY = "alapiha-greenhouse-v1" + (HOUSE_PREFIX ? "-" + HOUSE_NO : "");
const PIN_KEY = "alapiha-greenhouse-pin";  // family PIN, remembered on this device after it works once
// name + PIN are asked once on the opening screen (pin-gate.js) and remembered while the site is in use
function getPin() { if (window.PinGate) return PinGate.getPin(); try { return localStorage.getItem(PIN_KEY) || ""; } catch (e) { return ""; } }
function setPin(v) { if (window.PinGate) return PinGate.setPin(v); try { v ? localStorage.setItem(PIN_KEY, v) : localStorage.removeItem(PIN_KEY); } catch (e) { /* ignore */ } }
const loggerName = () => (window.PinGate ? PinGate.getName() : "");
// no PIN yet (viewing only, or the site sat unused): show the opening screen once and wait
const askPin = reason => (window.PinGate ? PinGate.require(reason) : Promise.resolve(""));
let sections = DEFAULT_SECTIONS.map(s => ({ ...s }));
let mode = "local";       // "local" | "db" | "sheets" | "none"
let pendingSaves = 0;
let writeSeq = 0;
const rowQueue = {};       // id → promise of the save in progress for that spot          // bumped by every save, so an older sheet read can't undo it
let canWrite = true;
let db = null;

const statusEl = document.getElementById("status");
function setStatus(state, text) { statusEl.dataset.state = state; statusEl.textContent = text; }

function loadLocal() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && typeof saved === "object") {
      sections.forEach(s => { if (saved[s.id]) { s.species = saved[s.id].species || ""; s.note = saved[s.id].note || ""; } });
    }
  } catch (e) { /* storage unavailable: use defaults */ }
}

async function persist(s, pin) {
  if (mode === "db") {
    await db.doc("sections/" + s.id).set({ species: s.species, note: s.note });
    return;
  }
  if (mode === "sheets") {
    // saves of the same spot go out one after another, in order
    pendingSaves++; writeSeq++;
    const prev = rowQueue[s.id] || Promise.resolve();
    let release;
    rowQueue[s.id] = new Promise(r => { release = r; });
    await prev;
    try {
      // text/plain keeps this a "simple" request, which Apps Script accepts from any site
      const res = await fetch(SHEETS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ id: HOUSE_PREFIX + s.id, name: HOUSE_NAME + " · " + s.name, species: s.species, note: s.note, pin: pin || "", by: loggerName() }),
      });
      const out = await res.json();
      if (!out.ok) {
        const err = new Error(out.error || "save failed");
        if (out.error === "bad pin") err.code = "bad_pin";
        throw err;
      }
    } finally {
      pendingSaves--;
      release();
    }
    return;
  }
  try {
    const out = {};
    sections.forEach(x => out[x.id] = { species: x.species, note: x.note });
    localStorage.setItem(STORE_KEY, JSON.stringify(out));
  } catch (e) { /* ignore */ }
}

function applyRemote(docs) {
  const byDoc = {};
  docs.forEach(d => { if (d.exists) byDoc[d.id] = d.data() || {}; });
  sections.forEach((s, i) => {
    const d = byDoc[s.id];
    const def = DEFAULT_SECTIONS[i];
    s.species = d ? String(d.species || "") : def.species;
    s.note = d ? String(d.note || "") : def.note;
  });
  sections.forEach(refreshSection);
  renderList();
  applySearch();
  if (!editing) renderDetail();
}

async function loadSheet() {
  const seq = writeSeq, busy = pendingSaves > 0;
  const res = await fetch(SHEETS_URL + (SHEETS_URL.includes("?") ? "&" : "?") + "t=" + Date.now());
  const out = await res.json();
  // ignore a read that overlapped a save: it may show the sheet from before the save
  if (busy || pendingSaves || seq !== writeSeq) return;
  const entries = Object.entries(out.sections || {})
    .filter(([id]) => id.startsWith(HOUSE_PREFIX))
    .map(([id, d]) => ({ id: id.slice(HOUSE_PREFIX.length), exists: true, data: () => d }));
  applyRemote(entries);
}

function connectSheets() {
  mode = "sheets";
  if (window.PinGate) PinGate.init(SHEETS_URL);
  setStatus("loading", "Ladataan merkintöjä…");
  let ok = false;
  const tick = async () => {
    try {
      await loadSheet();
      if (!ok) setStatus("shared", "Merkinnät tallentuvat yhteiseen Google-taulukkoon ja näkyvät kaikille");
      ok = true;
    } catch (e) {
      ok = false;
      setStatus("offline", "Google-taulukkoon ei saada yhteyttä. Yritetään uudelleen hetken päästä…");
    }
  };
  tick();
  setInterval(() => { if (!document.hidden) tick(); }, SHEETS_POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
}

async function connectStore() {
  if ((!window.claude || typeof window.claude.use !== "function") && SHEETS_URL) {
    connectSheets();
    return;
  }
  if (!window.claude || typeof window.claude.use !== "function") {
    mode = "local";
    loadLocal();
    setStatus("local", "Paikallinen kopio: merkinnät tallentuvat vain tähän selaimeen");
    return;
  }
  setStatus("loading", "Ladataan merkintöjä…");
  db = await window.claude.use("db");
  if (!db) {
    mode = "none"; canWrite = false;
    setStatus("readonly", "Kirjaudu claude.ai-palveluun nähdäksesi kasvimerkinnät");
    renderDetail();
    return;
  }
  mode = "db";
  const user = await window.claude.use("user");
  const can = user ? await user.can("data.write") : null;
  canWrite = can !== false;

  const timer = setTimeout(() => setStatus("offline", "Tallennettuja merkintöjä ei vielä tavoiteta. Näytetään tähän mennessä ladatut."), 10000);
  db.collection("sections").onSnapshot(snap => {
    applyRemote(snap.docs);
    if (!snap.metadata.fromCache) {
      clearTimeout(timer);
      setStatus(canWrite ? "shared" : "readonly",
        canWrite ? "Merkinnät näkyvät kaikille, jotka avaavat tämän sivun" : "Vain katselu: pyydä omistajalta muokkausoikeus, jos haluat muuttaa merkintöjä");
    }
  }, err => {
    clearTimeout(timer);
    setStatus("offline", "Tallennettuja merkintöjä ei voitu ladata. Avaa sivu uudelleen ja yritä uudestaan.");
  });
  renderDetail();
}

const byId = id => sections.find(s => s.id === id);
let selectedId = null;
let editing = false;
const TAB_KEY = "alapiha-greenhouse-tab";
let activeTab = "all";
try { const t = localStorage.getItem(TAB_KEY); if (["all", "table", "lane", "plants"].includes(t)) activeTab = t; } catch (e) { /* ignore */ }

/* ---------------- SVG rendering ---------------- */
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};

function truncate(str, max) { return str.length > max ? str.slice(0, max - 1) + "…" : str; }

function drawStatic() {
  svg.setAttribute("viewBox", `-24 -24 ${W + 48} ${H + 100}`);   // "-24 -24 832 1210" in Kasvihuone 1
  // smaller houses are drawn smaller than Kasvihuone 1 (never below 60 %, so they stay easy to tap)
  if (!IS_ORIGINAL) svg.style.maxHeight = `calc((100vh - 150px) * ${Math.min(1, Math.max(0.6, (H + 100) / 1210)).toFixed(3)})`;
  el("rect", { x: 0, y: 0, width: W, height: H, class: "floor" }, svg);
  // walls with an entrance gap in the bottom wall
  el("path", { class: "wall", d: `M${DOOR[0]} ${H} H0 V0 H${W} V${H} H${DOOR[1]}` }, svg);
  el("path", { class: "entrance-arrow", d: `M${W / 2} ${H + 45} V${H + 12} M${W / 2 - 11} ${H + 24} L${W / 2} ${H + 12} L${W / 2 + 11} ${H + 24}` }, svg);
  el("text", { x: W / 2, y: H + 70, class: "entrance-text" }, svg).textContent = "Sisäänkäynti";
}

const nodes = {}; // id -> { g, label }

function drawBadge(parent, x, y, text) {
  const b = el("g", { class: "badge" }, parent);
  el("circle", { cx: x, cy: y, r: 15 }, b);
  el("text", { x, y }, b).textContent = text;
  return b;
}

function drawSection(s) {
  const g = GEOM[s.id];
  const grp = el("g", { class: `sec ${s.kind}${s.part ? " " + s.part : ""}`, "data-id": s.id, tabindex: 0, role: "button" }, svg);
  let label = null;

  if (s.kind === "table") {
    const [x, y, w, h] = g.rect;
    if (s.part === "side") {
      // thin strip: a wider invisible area makes it easy to tap
      const pad = 3;
      el("rect", { class: "side-hit", x: w < h ? x - pad : x, y: w < h ? y : y - pad, width: w < h ? w + pad * 2 : w, height: w < h ? h : h + pad * 2 }, grp);
    }
    el("rect", { class: "shape", x, y, width: w, height: h, rx: g.rx ?? 6 }, grp);
    if (g.label) {
      const [lx, ly] = g.label;
      label = el("text", { class: "sec-label", x: lx, y: ly, transform: g.rotate ? `rotate(-90 ${lx} ${ly})` : "" }, grp);
    }
  } else if (s.kind === "lane") {
    const [hx, hy, hw, hh] = g.hit;
    el("rect", { class: "lane-hit", x: hx, y: hy, width: hw, height: hh }, grp);
    const [x, y, w, h] = g.rect;
    el("rect", { class: "shape", x, y, width: w, height: h, rx: Math.min(w, h) / 2 }, grp);
  } else {
    const xs = g.pts.map(p => p[0]), ys = g.pts.map(p => p[1]);
    const pad = g.r + 7;
    const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
    el("rect", { class: "hit", x: x0, y: y0, width: Math.max(...xs) - x0 + pad, height: Math.max(...ys) - y0 + pad, rx: 14 }, grp);
    for (const [cx, cy] of g.pts) {
      el("circle", { class: "tap", cx, cy, r: g.r + 3 }, grp);
      el("circle", { class: "pot", cx, cy, r: g.r }, grp);
    }
    if (g.label) label = el("text", { class: "sec-label", x: g.label[0], y: g.label[1] }, grp);
  }

  if (g.badge) {
    const b = drawBadge(grp, g.badge[0], g.badge[1], s.id);
    // bottom row: badge sits left of its label
    if (s.id === "H5") { b.setAttribute("transform", "translate(-150 0)"); label.setAttribute("x", g.label[0] + 15); }
  }

  nodes[s.id] = { g: grp, label };
  bindSection(grp, s.id);
}

function drawSections() {
  // tables, then the planting lines on top of them, then hanging plants on top
  sections.filter(s => s.kind === "table").forEach(drawSection);

  // table outline and code badge on top of the sections (not clickable)
  for (const t of TABLES) {
    const [x, y, w, h] = t.rect;
    const frame = el("g", { class: "frame" }, svg);
    el("rect", { class: "frame-outline", x, y, width: w, height: h, rx: 4 }, frame);
    // long tables: badge above the back end; back-wall tables: badge at their outer end
    const outerLeft = x + w / 2 < W / 2;
    drawBadge(frame, t.dir === "v" ? x + w / 2 : (outerLeft ? x - 18 : x + w + 18), t.dir === "v" ? FRAME_BADGE_Y : y + h / 2, t.id);
  }

  sections.filter(s => s.kind === "lane").forEach(drawSection);

  // line numbers under each lined table (not clickable)
  for (const s of sections.filter(x => x.kind === "lane")) {
    if (!GEOM[s.id].num) continue;
    const [nx, ny] = GEOM[s.id].num;
    el("text", { class: "lane-num", x: nx, y: ny }, svg).textContent = s.id.split("-")[1];
  }

  sections.filter(s => s.kind === "plants").forEach(drawSection);
}

function refreshSection(s) {
  const n = nodes[s.id];
  n.g.classList.toggle("empty", !s.species);
  n.g.setAttribute("aria-label", `${s.id}, ${s.name}: ${s.species || "ei merkitty"}`);
  if (n.label) {
    const max = s.kind === "lane" ? 36 : s.kind === "table" ? 18 : 30;
    n.label.textContent = s.species ? truncate(s.species, max) : "";
    n.label.classList.toggle("empty", !s.species);
  }
}

/* ---------------- interaction ---------------- */
const tip = document.getElementById("tip");
const wrap = document.querySelector(".map-wrap");

function setHighlight(id, on) {
  nodes[id]?.g.classList.toggle("hl", on);
  document.querySelector(`#list button[data-id="${id}"]`)?.classList.toggle("hl", on);
}

function bindSection(grp, id) {
  grp.addEventListener("pointerenter", e => { setHighlight(id, true); if (e.pointerType === "mouse") showTip(id, e); });
  grp.addEventListener("pointermove", e => { if (e.pointerType === "mouse") moveTip(e); });
  grp.addEventListener("pointerleave", () => { setHighlight(id, false); tip.classList.remove("show"); });
  grp.addEventListener("click", () => select(id));
  grp.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(id); } });
  grp.addEventListener("focus", () => setHighlight(id, true));
  grp.addEventListener("blur", () => setHighlight(id, false));
}

function showTip(id, e) {
  const s = byId(id);
  tip.innerHTML = "";
  const b = document.createElement("b"); b.textContent = `${s.id} · ${s.name}`;
  tip.append(b, document.createTextNode(s.species || "Kasvia ei ole vielä merkitty"));
  tip.classList.add("show");
  moveTip(e);
}
function moveTip(e) {
  const r = wrap.getBoundingClientRect();
  tip.style.left = (e.clientX - r.left) + "px";
  tip.style.top = (e.clientY - r.top) + "px";
}

function select(id) {
  selectedId = id;
  editing = false;
  const kind = byId(id).kind;
  if (activeTab !== "all" && kind !== activeTab && !search.value.trim()) setTab(kind, false);
  Object.entries(nodes).forEach(([k, n]) => n.g.classList.toggle("selected", k === id));
  renderDetail();
  openPopup(id);
}

/* ---------------- pop-up: type the plant straight in ---------------- */
const pop = document.getElementById("pop");
const popForm = document.getElementById("pop-form");
const popSpecies = document.getElementById("pop-species");
const popNote = document.getElementById("pop-note");
let popId = null;

function openPopup(id) {
  const s = byId(id);
  popId = id;
  tip.classList.remove("show");
  document.getElementById("pop-code").textContent = s.id;
  document.getElementById("pop-title").textContent = s.name;
  const kindName = s.floor ? "lattia" : s.part === "side" ? "pöydän sivukaista" : { table: "pöydän osa", lane: "kukkakouru", plants: "amppelit" }[s.kind];
  document.getElementById("pop-kind").textContent = kindName;

  pop.classList.toggle("readonly", !canWrite);
  document.getElementById("pop-view").textContent = s.species || "Kasvia ei ole vielä merkitty";
  document.getElementById("pop-view").classList.toggle("none", !s.species);
  document.getElementById("pop-view-note").textContent = s.note;
  popSpecies.value = s.species;
  popNote.value = s.note;
  document.getElementById("pop-clear").hidden = !s.species && !s.note;
  showPopError("");
  setPopBusy(false);

  pop.hidden = false;
  requestAnimationFrame(() => (canWrite ? popSpecies : document.getElementById("pop-close")).focus());
}

function closePopup() {
  if (pop.hidden || popBusy) return;
  pop.hidden = true;
  const id = popId; popId = null;
  nodes[id]?.g.focus({ preventScroll: true });
}

const popErr = document.getElementById("pop-err");
let popBusy = false;
function showPopError(text) { popErr.textContent = text; popErr.hidden = !text; }
function setPopBusy(on) {
  popBusy = on;
  pop.querySelectorAll(".pop-edit button").forEach(b => b.disabled = on);
  popForm.querySelector("button[type=submit]").textContent = on ? "Tallennetaan…" : "Tallenna";
}

async function saveFromPopup(species, note) {
  const s = popId && byId(popId);
  if (!s) { closePopup(); return; }
  if (popBusy) return;
  if (mode !== "sheets") {
    s.species = species; s.note = note;
    closePopup();
    commit(s);
    return;
  }
  // Google Sheet: the family PIN is checked by the Apps Script before saving.
  // Wait for the answer here, so a wrong PIN keeps the pop-up open.
  const pin = getPin() || await askPin("save");
  if (!pin) { showPopError("Tallentaminen vaatii nimesi ja PIN-koodin."); return; }
  showPopError("");
  setPopBusy(true);
  try {
    await persist({ ...s, species, note }, pin);
  } catch (e) {
    setPopBusy(false);
    if (e && e.code === "bad_pin") {
      setPin("");
      showPopError("PIN-koodi on vaihtunut. Kirjoita uusi koodi ja paina Tallenna uudelleen.");
      askPin("bad");
    } else {
      showPopError("Tallennus ei onnistunut. Tarkista verkkoyhteys ja yritä uudelleen.");
    }
    return;
  }
  setPin(pin);
  setPopBusy(false);
  s.species = species; s.note = note;
  closePopup();
  refreshSection(s);
  renderList();
  applySearch();
  editing = false;
  renderDetail();
}

popForm.addEventListener("submit", e => {
  e.preventDefault();
  saveFromPopup(popSpecies.value.trim(), popNote.value.trim());
});
document.getElementById("pop-cancel").onclick = closePopup;
document.getElementById("pop-close").onclick = closePopup;
document.getElementById("pop-clear").onclick = () => saveFromPopup("", "");
pop.addEventListener("click", e => { if (e.target === pop) closePopup(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePopup(); });
// keep keyboard focus inside the pop-up while it is open
pop.addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const f = [...pop.querySelectorAll("button:not(:disabled), input, textarea")].filter(x => !x.hidden && x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

/* ---------------- detail panel ---------------- */
const detail = document.getElementById("detail");

function renderDetail() {
  detail.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = "Valittu";
  detail.appendChild(h);

  if (!selectedId) {
    const p = document.createElement("p"); p.className = "hint";
    p.textContent = TABS.find(t => t.kind === activeTab).hint;
    detail.appendChild(p);
    return;
  }
  const s = byId(selectedId);
  const title = document.createElement("div"); title.className = "detail-title";
  const code = document.createElement("span"); code.className = "code"; code.textContent = s.id;
  const h3 = document.createElement("h3"); h3.textContent = s.name;
  title.append(code, h3);
  detail.appendChild(title);

  const sp = document.createElement("div");
  sp.className = "species" + (s.species ? "" : " none");
  sp.textContent = s.species || "Kasvia ei ole vielä merkitty";
  detail.appendChild(sp);
  if (s.note) { const n = document.createElement("p"); n.className = "note"; n.textContent = s.note; detail.appendChild(n); }
  if (!canWrite) return;
  const btns = document.createElement("div"); btns.className = "btns";
  const edit = document.createElement("button"); edit.className = "primary";
  edit.textContent = s.species ? "Muokkaa kasvia" : "Lisää kasvi";
  edit.onclick = () => openPopup(s.id);
  btns.appendChild(edit);
  detail.appendChild(btns);
}

async function commit(s) {
  try {
    await persist(s);
  } catch (e) {
    if (e && e.code === "invalid_argument") {
      canWrite = false;
      setStatus("readonly", "Vain katselu: pyydä omistajalta muokkausoikeus, jos haluat muuttaa merkintöjä");
    } else {
      setStatus("offline", "Merkintää ei tallennettu. Tarkista verkkoyhteys ja yritä uudelleen.");
    }
  }
  refreshSection(s);
  renderList();
  applySearch();
  editing = false;
  renderDetail();
}

/* The section list was removed (hovering the map shows each label);
   this now only refreshes the view buttons and their counts. */
function renderList() {
  renderTabs();
}

/* ---------------- search ----------------
   Searching looks through all three tabs at once. */
const search = document.getElementById("search");
function applySearch() {
  const q = search.value.trim().toLowerCase();
  svg.classList.toggle("searching", !!q);
  for (const s of sections) {
    const hit = !q || [s.species, s.note, s.name, s.id].some(v => v.toLowerCase().includes(q));
    nodes[s.id].g.classList.toggle("match", !!q && hit);
  }
}
search.addEventListener("input", () => { renderList(); applySearch(); });

/* ---------------- tabs ---------------- */
const tabsEl = document.getElementById("tabs");
function renderTabs() {
  tabsEl.innerHTML = "";
  for (const t of TABS) {
    const b = document.createElement("button");
    b.type = "button"; b.id = "tab-" + t.kind; b.className = "kind-" + t.kind;
    b.setAttribute("aria-pressed", String(t.kind === activeTab));
    const ofKind = t.kind === "all" ? sections : sections.filter(s => s.kind === t.kind);
    const labelled = ofKind.filter(s => s.species).length;
    const total = ofKind.length;
    const dot = document.createElement("i"); dot.className = "kdot"; dot.setAttribute("aria-hidden", "true");
    b.appendChild(dot);
    const name = document.createElement("span"); name.textContent = t.label;
    const count = document.createElement("span"); count.className = "count"; count.textContent = `${labelled}/${total}`;
    count.title = `${labelled}/${total} merkitty`;
    b.append(name, count);
    b.onclick = () => setTab(t.kind, true);
    tabsEl.appendChild(b);
  }
}
function setTab(kind, clearSelection) {
  activeTab = kind;
  svg.dataset.tab = kind;
  try { localStorage.setItem(TAB_KEY, kind); } catch (e) { /* ignore */ }
  if (clearSelection && kind !== "all" && selectedId && byId(selectedId).kind !== kind) {
    selectedId = null; editing = false;
    Object.values(nodes).forEach(n => n.g.classList.remove("selected"));
  }
  renderList();
  applySearch();
  renderDetail();
}

/* ---------------- light / dark toggle ----------------
   Follows the device setting until the viewer picks one; the choice
   is remembered in this browser. */
const THEME_KEY = "alapiha-greenhouse-theme";
const themeBtn = document.getElementById("theme-toggle");
const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
function currentTheme() {
  const set = document.documentElement.getAttribute("data-theme");
  return set === "dark" || set === "light" ? set : (darkQuery.matches ? "dark" : "light");
}
function syncThemeButton() {
  const dark = currentTheme() === "dark";
  themeBtn.classList.toggle("is-dark", dark);
  themeBtn.querySelector(".theme-label").textContent = dark ? "Vaalea" : "Tumma";
  themeBtn.setAttribute("aria-label", dark ? "Vaihda vaaleaan tilaan" : "Vaihda tummaan tilaan");
}
try {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
} catch (e) { /* storage unavailable: follow the device */ }
themeBtn.addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }
  syncThemeButton();
});
darkQuery.addEventListener("change", syncThemeButton);
new MutationObserver(syncThemeButton).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
syncThemeButton();

/* ---------------- switching houses ----------------
   Houses in the order they stand on the yard, left to right. The arrow
   (or a swipe, or the ← → keys) opens the next one; after the last it
   wraps round to the first. */
const HOUSE_ORDER = ["5", "1", "2", "3", "4"];
const SLIDE_KEY = "alapiha-slide";
function houseUrl(no) { return "kasvihuone.html?talo=" + no; }
function neighbour(step) {
  const i = HOUSE_ORDER.indexOf(HOUSE_NO);
  return HOUSE_ORDER[(i + step + HOUSE_ORDER.length) % HOUSE_ORDER.length];
}
function goHouse(no, dir) {
  if (no === HOUSE_NO) return;
  try { sessionStorage.setItem(SLIDE_KEY, dir); } catch (e) { /* ignore */ }
  const m = document.querySelector("main");
  m.classList.add(dir === "prev" ? "leaving-prev" : "leaving-next");
  setTimeout(() => { location.href = houseUrl(no); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 130);
}
function setupHouseNav() {
  const nav = document.getElementById("house-nav");
  const edge = document.getElementById("edge-next");
  if (window.claude) { nav.hidden = true; edge.hidden = true; return; }   // claude.ai copy has only one house
  const next = neighbour(1), prev = neighbour(-1);
  const nextA = document.getElementById("hn-next"), prevA = document.getElementById("hn-prev");
  nextA.href = edge.href = houseUrl(next);
  prevA.href = houseUrl(prev);
  nextA.querySelector(".hn-name").textContent = HOUSE_NAMES[next];
  prevA.querySelector(".hn-name").textContent = HOUSE_NAMES[prev];
  nextA.setAttribute("aria-label", "Seuraava: " + HOUSE_NAMES[next]);
  prevA.setAttribute("aria-label", "Edellinen: " + HOUSE_NAMES[prev]);
  edge.title = "Seuraava: " + HOUSE_NAMES[next];
  const go = (no, dir) => e => { e.preventDefault(); goHouse(no, dir); };
  nextA.addEventListener("click", go(next, "next"));
  edge.addEventListener("click", go(next, "next"));
  prevA.addEventListener("click", go(prev, "prev"));
  const dots = document.getElementById("hn-dots");
  const here = HOUSE_ORDER.indexOf(HOUSE_NO);
  HOUSE_ORDER.forEach((no, i) => {
    const a = document.createElement("a");
    a.href = houseUrl(no);
    a.setAttribute("aria-label", HOUSE_NAMES[no]);
    a.title = HOUSE_NAMES[no];
    if (no === HOUSE_NO) a.setAttribute("aria-current", "page");
    a.addEventListener("click", go(no, i < here ? "prev" : "next"));
    dots.appendChild(a);
  });

  // swipe on the map: finger moves left → next house, right → previous
  const area = document.querySelector("main");
  let sw = null;
  area.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" && e.isPrimary) sw = { x: e.clientX, y: e.clientY, t: Date.now() }; });
  area.addEventListener("pointerup", e => {
    if (!sw || e.pointerType === "mouse") return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y, dt = Date.now() - sw.t;
    sw = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6 || dt > 700) return;
    if (!pop.hidden) return;
    dx < 0 ? goHouse(next, "next") : goHouse(prev, "prev");
  });
  area.addEventListener("pointercancel", () => { sw = null; });
  // a sideways swipe should not scroll or zoom the page
  document.getElementById("map").style.touchAction = "pan-y pinch-zoom";

  // keyboard: ← → switch houses when not typing
  document.addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    if (!pop.hidden || e.altKey || e.ctrlKey || e.metaKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) return;
    e.key === "ArrowRight" ? goHouse(next, "next") : goHouse(prev, "prev");
  });

  // slide in from the side we came from
  let dir = null;
  try { dir = sessionStorage.getItem(SLIDE_KEY); sessionStorage.removeItem(SLIDE_KEY); } catch (e) { /* ignore */ }
  if (dir === "next" || dir === "prev") document.querySelector("main").classList.add("slide-" + dir);
  // coming back with the browser's back button: undo the fade-out
  window.addEventListener("pageshow", () => document.querySelector("main").classList.remove("leaving-next", "leaving-prev"));
}

/* ---------------- init ---------------- */
document.documentElement.lang = "fi";
document.getElementById("page-title").textContent = HOUSE_NAME + " · Kasvikartta";
document.getElementById("map-title").textContent = HOUSE_NAME;
document.title = HOUSE_NAME + " · Alapihan Puutarha";
// on claude.ai there is no yard page to go back to
if (window.claude) document.getElementById("back").hidden = true;
drawStatic();
setupHouseNav();
drawSections();
sections.forEach(refreshSection);
setTab(activeTab, false);
connectStore().then(() => { if (mode === "local") { sections.forEach(refreshSection); renderList(); renderDetail(); } });
</script>
